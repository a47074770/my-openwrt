name: Cloud Build OpenWrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: 安装编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo u-boot-tools upx-ucl unzip xz-utils zlib1g-dev zstd
        sudo timedatectl set-timezone "Asia/Shanghai"

    - name: 克隆源码并添加所有定制依赖
      run: |
        git clone https://github.com -b master openwrt
        cd openwrt
        
        # 注入 iStore 商店源
        echo "src-git istore https://github.com" >> feeds.conf.default
        echo "src-git linkease https://github.com" >> feeds.conf.default
        
        # 注入 PassWall 及其依赖源
        echo "src-git passwall_packages https://github.com" >> feeds.conf.default
        echo "src-git passwall https://github.com" >> feeds.conf.default
        
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        
        # 安全下载 Cloudflare 优选 IP 插件
        cd package
        git clone https://github.com temp_repo
        mv temp_repo/luci-app-cloudflarespeedtest ./
        rm -rf temp_repo
        cd ..

    - name: 启动网页终端 (make menuconfig)
      uses: mxschmitt/action-tmate@v3
      timeout-minutes: 30

    - name: 下载源码包并开始编译
      run: |
        cd openwrt
        make defconfig
        make download -j8
        make -j$(nproc) || make -j1 || make -j1 V=s

    - name: 上传固件
      uses: actions/upload-artifact@v4
      with:
        name: OpenWrt_Firmware
        path: openwrt/bin/targets/
